name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-15 # Apple Silicon (arm64) runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build ClipStack (arm64)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ClipStack.xcodeproj \
            -scheme ClipStack \
            -configuration Release \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package DMG
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/ClipStack.app"
          test -d "$APP_PATH"
          rm -rf dmg && mkdir -p dmg
          cp -R "$APP_PATH" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create \
            -volname "ClipStack" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            ClipStack-arm64.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipStack-arm64.dmg
          path: ClipStack-arm64.dmg
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ClipStack-arm64.dmg
          generate_release_notes: true
